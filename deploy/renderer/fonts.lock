# Beuk renderer — the book's typefaces, pinned. One file per line:
#   sha256  destination (under /usr/share/fonts/truetype/beuk)  source URL
# deploy/renderer/fetch-fonts.mjs downloads each URL at build time and
# refuses any byte that does not match its sha256.
#
# Faces: exactly the families, weights and styles the studio loads from
# Google Fonts (the css2 link in client/index.html <head>), restricted
# to the twenty book families (BODY_FONTS + HEAD_FONTS). They are the
# static TrueType instances Google Fonts itself serves for those
# requests (fonts.gstatic.com, resolved 2026-10-25 from
# https://fonts.googleapis.com/css2 with a plain client): STATIC on
# purpose — Chromium (Skia/PDF) embedded the variable [wght] files from
# the google/fonts repository as Type 3 fonts (pdffonts, 2026-10-25),
# which press preflights treat as a defect; static TrueType embeds as
# CID TrueType. Every family is SIL Open Font License 1.1; its OFL.txt
# comes from the google/fonts repository at a pinned commit and is
# installed beside its fonts, as the licence requires for
# redistribution. The fonts are not modified.
