<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Beuk — beuk.studio</title>
    <script>
      /* Pre-paint, before any CSS: 1.0's own rules and keys (client/index.html
         head script and applyUiLang). Theme: Paper unless the saved choice
         says candlelight. Interface language: the saved choice's lang and
         direction, so the chrome never flips after first paint. The keys and
         the RTL list are filled in from 1.0 at build time (vite.config.ts,
         beukHtml) — no second copy. */
      try {
        if (window.localStorage && localStorage.getItem(__BEUK_THEME_KEY__) === "candlelight") {
          document.documentElement.setAttribute("data-theme", "candlelight");
        }
        var savedLang = window.localStorage && localStorage.getItem(__BEUK_LANG_KEY__);
        if (savedLang && __BEUK_LANGS__.indexOf(savedLang) !== -1) {
          document.documentElement.setAttribute("lang", savedLang);
          document.documentElement.setAttribute("dir", __BEUK_RTL__.indexOf(savedLang) !== -1 ? "rtl" : "ltr");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
