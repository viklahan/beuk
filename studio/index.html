<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Beuk — beuk.studio</title>
    <!-- The installed app (public/manifest.webmanifest): the same id as 1.0's manifest, starting at the studio. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      if (location.pathname === '/studio') history.replaceState(history.state, '', '/studio/' + location.search + location.hash);
      /* That first line, before anything reads document.baseURI: the app answers this page at /studio as well as at
         /studio/ (no redirect between the two: final review C2), and the page tidies its own address to /studio/, so
         everything relative (Zen's "assets/...") resolves under /studio/. The query and the hash stay (the doors,
         src/cloud/doors.ts). Every URL above this script is absolute.
         Pre-paint, before any CSS: 1.0's own rules and keys (client/index.html
         head script and applyUiLang). Theme: Paper unless the saved choice
         says candlelight. Interface language: the saved choice's lang and
         direction, so the chrome never flips after first paint. The keys and
         the RTL list are filled in from 1.0 at build time (vite.config.ts,
         beukHtml) — no second copy. */
      try {
        if (window.localStorage && localStorage.getItem(__BEUK_THEME_KEY__) === "candlelight") {
          document.documentElement.setAttribute("data-theme", "candlelight");
        }
        var savedLang = window.localStorage && localStorage.getItem(__BEUK_LANG_KEY__);
        if (savedLang && __BEUK_LANGS__.indexOf(savedLang) !== -1) {
          document.documentElement.setAttribute("lang", savedLang);
          document.documentElement.setAttribute("dir", __BEUK_RTL__.indexOf(savedLang) !== -1 ? "rtl" : "ltr");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
