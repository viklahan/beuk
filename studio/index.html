<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Beuk — beuk.studio</title>
    <script>
      /* Pre-paint, before any CSS: the same keys and rules as 1.0's head
         script (client/index.html), so both studios agree. Theme: Paper
         unless beuk.theme.v1 says candlelight. Interface language:
         beuk.uiLang.v1 when it names a pack; its direction is set by the
         app once the packs load, but Arabic is mirrored here already so
         the chrome never flips after first paint. */
      try {
        if (window.localStorage && localStorage.getItem("beuk.theme.v1") === "candlelight") {
          document.documentElement.setAttribute("data-theme", "candlelight");
        }
        var savedLang = window.localStorage && localStorage.getItem("beuk.uiLang.v1");
        if (savedLang) {
          document.documentElement.setAttribute("lang", savedLang);
          if (savedLang === "ar") document.documentElement.setAttribute("dir", "rtl");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
